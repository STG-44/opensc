[package]
name = "shadow-model-viewer"
default-run = "shadow-model-viewer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
shadow-formats.workspace = true
serde_json.workspace = true
sha2.workspace = true
hound = "=3.5.1"
bevy = { workspace = true, features = ["3d", "bevy_audio", "wav"] }

[[bin]]
name = "shadow-character-viewer"
path = "src/character.rs"

[[bin]]
name = "shadow-map-viewer"
path = "src/map.rs"

[[bin]]
name = "shadow-game"
path = "src/game.rs"
