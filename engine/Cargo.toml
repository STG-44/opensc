[workspace]
members = ["crates/shadow-formats", "crates/shadow-tools", "crates/shadow-viewer", "crates/shadow-model-viewer"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[workspace.dependencies]
shadow-formats = { path = "crates/shadow-formats" }
encoding_rs = "0.8"
serde_json = "1"
sha2 = "0.10"
bevy = { version = "=0.20.0", default-features = false, features = ["2d", "ui", "bmp", "jpeg"] }

# Первый полный build Bevy долгий; оптимизацию включаем позднее по измерениям.
[profile.dev]
debug = 1
