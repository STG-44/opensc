[package]
name = "opensc-web"
version = "0.2.0"
edition = "2024"
rust-version = "1.89"
description = "Rust/Axum file server with abuse controls for OpenSC"

[workspace]

[dependencies]
opensc-report-protocol = { path = "../crates/report-protocol" }
rusqlite = { version = "=0.41.0", features = ["bundled", "backup"] }
serde_json = "1"
sha2 = "0.11"
axum = { version = "=0.8.9", default-features = false, features = ["http1", "tokio", "json"] }
http-body = "1"
percent-encoding = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }
tower-http = { version = "0.6", features = ["fs"] }

[dev-dependencies]
http-body-util = "0.1"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

[profile.release]
strip = true
lto = "thin"
