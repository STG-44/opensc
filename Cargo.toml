[package]
name = "opensc-launcher"
version = "0.3.0"
edition = "2024"
rust-version = "1.89"
description = "Launcher and update client for the Shadow Company engine recreation"

[dependencies]
anyhow = "1"
eframe = { version = "=0.33.3", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls"] }
rfd = "0.16"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tempfile = "3"
url = { version = "2", features = ["serde"] }
walkdir = "2"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[features]
screenshot = ["eframe/__screenshot"]

[profile.release]
strip = true
lto = "thin"

