name: Build launcher
on:
  workflow_dispatch:
  push:
    tags: ["launcher-v*"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: x86_64-apple-darwin
            platform: macos-x86_64
            executable: opensc-launcher
          - os: macos-latest
            target: aarch64-apple-darwin
            platform: macos-aarch64
            executable: opensc-launcher
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows-x86_64
            executable: opensc-launcher.exe
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            platform: linux-x86_64
            executable: opensc-launcher
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Linux build libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libxi-dev libxrandr-dev libxcursor-dev libegl1-mesa-dev libgtk-3-dev
      - name: Rust target
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy && rustup target add ${{ matrix.target }}
      - run: cargo fmt --check
      - run: cargo test --locked
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        run: python scripts/package_launcher.py --binary target/${{ matrix.target }}/release/${{ matrix.executable }} --platform ${{ matrix.platform }} --output dist
      - uses: actions/upload-artifact@v7
        with:
          name: opensc-launcher-${{ matrix.platform }}
          path: dist/*
